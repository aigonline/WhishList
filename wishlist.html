<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - My Wishlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .wishlist-item {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .wishlist-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        .heart-icon {
            transition: transform 0.2s;
        }
        
        .heart-icon:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Menu Icon -->
                <button id="menu-button" class="text-gray-700 hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- Search Bar -->
                <div class="flex-1 max-w-md mx-4">
                    <div class="relative">
                        <input type="text" placeholder="search here..." class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
                
                <!-- Right Icons -->
                <div class="flex items-center space-x-4">
                    <!-- Notifications -->
                    <button class="text-gray-700 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                    </button>
                    
                    <!-- Profile -->
                    <button class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center hover:bg-yellow-500 transition-colors">
                        <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- Page Title -->
        <div class="mb-8">
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">WISHLIST</h1>
        </div>

        <!-- Wishlist Items -->
        <div class="space-y-4" id="wishlistContainer">
            <!-- Wishlist Item 1 -->
            <div class="wishlist-item bg-yellow-400 rounded-2xl p-6 flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-4 flex-1">
                    <!-- Icon -->
                    <div class="w-16 h-16 flex items-center justify-center">
                        <svg class="w-12 h-12 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
                        </svg>
                    </div>
                    
                    <!-- Title -->
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-900">Pizza Palace<br>Discount</h3>
                    </div>
                    
                    <!-- Heart Icon -->
                    <button class="heart-icon" onclick="removeFromWishlist(this)">
                        <svg class="w-8 h-8 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Wishlist Item 2 -->
            <div class="wishlist-item bg-yellow-400 rounded-2xl p-6 flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-4 flex-1">
                    <!-- Icon -->
                    <div class="w-16 h-16 flex items-center justify-center">
                        <svg class="w-12 h-12 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
                        </svg>
                    </div>
                    
                    <!-- Title -->
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-900">Pizza Palace<br>Discount</h3>
                    </div>
                    
                    <!-- Heart Icon -->
                    <button class="heart-icon" onclick="removeFromWishlist(this)">
                        <svg class="w-8 h-8 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Wishlist Item 3 -->
            <div class="wishlist-item bg-yellow-400 rounded-2xl p-6 flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-4 flex-1">
                    <!-- Icon -->
                    <div class="w-16 h-16 flex items-center justify-center">
                        <svg class="w-12 h-12 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"/>
                        </svg>
                    </div>
                    
                    <!-- Title -->
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-900">Weekend Hotel<br>Stay</h3>
                    </div>
                    
                    <!-- Heart Icon -->
                    <button class="heart-icon" onclick="removeFromWishlist(this)">
                        <svg class="w-8 h-8 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Wishlist Item 4 -->
            <div class="wishlist-item bg-yellow-400 rounded-2xl p-6 flex items-center justify-between shadow-md">
                <div class="flex items-center space-x-4 flex-1">
                    <!-- Icon -->
                    <div class="w-16 h-16 flex items-center justify-center">
                        <svg class="w-14 h-14 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                        </svg>
                    </div>
                    
                    <!-- Title and Button -->
                    <div class="flex-1 flex items-center justify-between">
                        <h3 class="text-xl font-bold text-gray-900">Supermarket<br>Savings</h3>
                        
                        <!-- Buy Now Button -->
                        <button class="bg-gray-900 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-800 transition-colors uppercase text-sm tracking-wide">
                            Buy Now
                        </button>
                    </div>
                    
                    <!-- Heart Icon -->
                    <button class="heart-icon ml-4" onclick="removeFromWishlist(this)">
                        <svg class="w-8 h-8 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State (hidden by default) -->
        <div id="emptyState" class="hidden text-center py-20">
            <svg class="w-24 h-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
            <h2 class="text-2xl font-bold text-gray-400 mb-2">Your Wishlist is Empty</h2>
            <p class="text-gray-500 mb-6">Start adding deals to your wishlist!</p>
            <a href="deals.html" class="inline-block bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-8 rounded-xl transition-colors uppercase tracking-wide">
                Browse Deals
            </a>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        function removeFromWishlist(button) {
            const item = button.closest('.wishlist-item');
            item.style.opacity = '0';
            item.style.transform = 'translateX(100px)';
            
            setTimeout(() => {
                item.remove();
                
                // Check if wishlist is empty
                const container = document.getElementById('wishlistContainer');
                if (container.children.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                }
            }, 300);
        }
    </script>
</body>
</html>
