<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .category-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 dark:text-gray-100">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Left: menu + logo -->
                <div class="flex items-center space-x-3">
                    <button id="menu-button" class="text-gray-700 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>

                    <a href="index.html" class="flex items-center space-x-2">
                        <img src="images/logo.png" alt="Logo" class="w-10 h-10 object-contain">
                        <span class="hidden sm:inline text-lg font-bold text-gray-900">Wishlist</span>
                    </a>
                    <!-- Desktop nav links -->
                    <nav class="hidden md:flex items-center space-x-6 ml-4">
                        <a href="index.html" class="text-gray-700 hover:text-yellow-400 font-medium">Home</a>
                        <a href="deals.html" class="text-gray-700 hover:text-yellow-400 font-medium">Deals</a>
                        <a href="wishlist.html" class="text-gray-700 hover:text-yellow-400 font-medium">Wishlist</a>
                    </nav>
                </div>

                <!-- Center: Search (hidden on small screens) -->
                <div class="flex-1 max-w-md mx-4 hidden sm:block">
                    <div class="relative">
                        <input type="text" placeholder="search here..." class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Right Icons -->
                <div class="flex items-center space-x-4">
                    <!-- Dark Mode Toggle (with page icon) -->
                    <button id="darkToggle" aria-label="Toggle dark mode" class="relative inline-flex items-center h-8 w-14 rounded-full bg-gray-300 hover:bg-gray-400 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors">
                        <!-- Page icon (home/wishlist) -->
                        <svg class="absolute left-2 top-1/2 transform -translate-y-1/2 text-gray-700 dark:text-yellow-300 w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M3 9.5l9-7 9 7V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V9.5z" />
                        </svg>
                        <span class="inline-block h-5 w-5 transform translate-x-1 rounded-full bg-white transition-transform flex items-center justify-center overflow-hidden">
                            <svg class="sun w-4 h-4 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                            <svg class="moon hidden w-4 h-4 text-gray-800" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                        </span>
                    </button>

                    <!-- Notifications -->
                    <button class="text-gray-700 hover:text-gray-900 relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                    </button>

                    <!-- Profile -->
                    <button class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center hover:bg-yellow-500 transition-colors">
                        <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex flex-col items-center justify-center min-h-[70vh]">
            <!-- Categories Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
                <!-- Restaurants -->
                <a href="deals.html?category=restaurants" class="category-card bg-white rounded-2xl p-8 shadow-md border-2 border-gray-200 hover:border-yellow-400 dark:bg-gray-800 dark:border-gray-700 dark:hover:border-yellow-400 dark:text-gray-100 cursor-pointer">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-24 h-24 bg-yellow-400 rounded-2xl flex items-center justify-center mb-4 relative">
                            <svg class="w-12 h-12 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M8.1 13.34l2.83-2.83L3.91 3.5c-1.56 1.56-1.56 4.09 0 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
                            </svg>

                        </div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wide">RESTAURANTS</h2>
                    </div>
                </a>

                <!-- Hotels -->
                <a href="deals.html?category=hotels" class="category-card bg-white rounded-2xl p-8 shadow-md border-2 border-gray-200 hover:border-yellow-400 dark:bg-gray-800 dark:border-gray-700 dark:hover:border-yellow-400 dark:text-gray-100 cursor-pointer">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-24 h-24 bg-yellow-400 rounded-2xl flex items-center justify-center mb-4 relative">
                            <svg class="w-12 h-12 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"/>
                                <path d="M7 10.19V18h2v-6h6v6h2v-7.81l-5-4.5L7 10.19zM14 6l.94.94L16.06 6H14zm-1.06-.94L14 6.06V4h-1.06v1.06z"/>
                            </svg>
                            
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wide">HOTELS</h2>
                    </div>
                </a>

                <!-- Airlines -->
                <a href="deals.html?category=airlines" class="category-card bg-white rounded-2xl p-8 shadow-md border-2 border-gray-200 hover:border-yellow-400 dark:bg-gray-800 dark:border-gray-700 dark:hover:border-yellow-400 dark:text-gray-100 cursor-pointer">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-24 h-24 bg-yellow-400 rounded-2xl flex items-center justify-center mb-4 relative">
                            <svg class="w-14 h-14 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                            </svg>
                            
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wide">AIRLINES</h2>
                    </div>
                </a>

                <!-- Groceries -->
                <a href="deals.html?category=groceries" class="category-card bg-white rounded-2xl p-8 shadow-md border-2 border-gray-200 hover:border-yellow-400 dark:bg-gray-800 dark:border-gray-700 dark:hover:border-yellow-400 dark:text-gray-100 cursor-pointer">
                    <div class="flex flex-col items-center text-center">
                        <div class="w-24 h-24 bg-yellow-400 rounded-2xl flex items-center justify-center mb-4">
                            <svg class="w-14 h-14 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wide">GROCERIES</h2>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
