<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .toggle-checkbox:checked {
            background-color: #fbbf24;
        }
        
        .toggle-checkbox:checked ~ .toggle-label {
            transform: translateX(100%);
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fbbf24;
            cursor: pointer;
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fbbf24;
            cursor: pointer;
            border: none;
        }
        
        .deal-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .deal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Menu Icon -->
                <button class="text-gray-700 hover:text-gray-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- Search Bar -->
                <div class="flex-1 max-w-md mx-4">
                    <div class="relative">
                        <input type="text" placeholder="search here..." class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
                
                <!-- Right Icons -->
                <div class="flex items-center space-x-4">
                    <!-- Notifications -->
                    <button class="text-gray-700 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                    </button>
                    
                    <!-- Profile -->
                    <button class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center hover:bg-yellow-500 transition-colors">
                        <svg class="w-5 h-5 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Sidebar Filters -->
            <aside class="w-full lg:w-80 bg-white rounded-xl shadow-md p-6 h-fit sticky top-24">
                <!-- Category Buttons -->
                <div class="space-y-3 mb-8">
                    <button class="category-filter w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-4 rounded-xl transition-colors text-left uppercase tracking-wide" data-category="restaurants">
                        Restaurants
                    </button>
                    <button class="category-filter w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-4 rounded-xl transition-colors text-left uppercase tracking-wide" data-category="hotels">
                        Hotels
                    </button>
                </div>

                <!-- Segmented Control -->
                <div class="mb-8">
                    <div class="border-l-4 border-gray-900 pl-4">
                        <h3 class="text-2xl font-black text-gray-900 mb-4 tracking-tight" style="writing-mode: vertical-rl; transform: rotate(180deg); float: left; height: 200px; margin-right: 20px; margin-left: -20px;">SEGROES</h3>
                        
                        <div class="space-y-6 ml-4">
                            <!-- Nearby Toggle -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="text-sm font-bold text-gray-900 uppercase tracking-wide">NEARBY</span>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" class="sr-only peer" id="nearbyToggle">
                                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-yellow-400 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-yellow-400"></div>
                                </label>
                            </div>

                            <!-- Top Rated Toggle -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="text-sm font-bold text-gray-900 uppercase tracking-wide">TOP-RATED</span>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" class="sr-only peer" id="topRatedToggle">
                                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-yellow-400 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-yellow-400"></div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Price Range -->
                <div class="mb-8">
                    <div class="border-l-4 border-gray-900 pl-4">
                        <h3 class="text-2xl font-black text-gray-900 mb-4 tracking-tight" style="writing-mode: vertical-rl; transform: rotate(180deg); float: left; height: 140px; margin-right: 20px; margin-left: -20px;">YTTERY</h3>
                        
                        <div class="ml-4">
                            <p class="text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">TOP RANGE</p>
                            <input type="range" min="0" max="100" value="30" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" id="priceRange">
                            <div class="flex justify-between text-sm font-semibold text-gray-600 mt-2">
                                <span>$0</span>
                                <span>$100+</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Apply Filters Button -->
                <button class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 px-6 rounded-xl transition-colors uppercase tracking-wide">
                    Apply Filters
                </button>
            </aside>

            <!-- Deals Section -->
            <section class="flex-1">
                <!-- Filter Tabs -->
                <div class="bg-white rounded-xl shadow-md p-2 mb-6 inline-flex gap-2">
                    <button class="filter-tab active px-6 py-2 bg-yellow-400 text-gray-900 font-bold rounded-lg uppercase tracking-wide text-sm">
                        Live Now
                    </button>
                    <button class="filter-tab px-6 py-2 text-gray-600 font-bold rounded-lg hover:bg-gray-100 uppercase tracking-wide text-sm">
                        Ending Soon
                    </button>
                </div>

                <!-- Deals Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="dealsContainer">
                    <!-- Deal Card 1 -->
                    <div class="deal-card bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="bg-yellow-400 p-6 relative">
                            <!-- Discount Badge -->
                            <div class="absolute top-4 left-4 bg-red-500 text-white font-black text-lg px-4 py-2 rounded-lg transform -rotate-12 shadow-lg">
                                75% OFF!
                            </div>
                            
                            <!-- Deal Icon -->
                            <div class="flex justify-center items-center h-32 mt-8">
                                <svg class="w-24 h-24 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.9 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/>
                                    <path d="M13.5 7c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5S11.17 5.5 12 5.5s1.5.67 1.5 1.5z"/>
                                </svg>
                            </div>
                            
                            <!-- Steam Effect -->
                            <div class="absolute top-12 right-12">
                                <div class="flex space-x-1">
                                    <div class="w-1 h-4 bg-gray-900 rounded-full animate-pulse"></div>
                                    <div class="w-1 h-6 bg-gray-900 rounded-full animate-pulse" style="animation-delay: 0.1s;"></div>
                                    <div class="w-1 h-5 bg-gray-900 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-900 mb-3">Sunrise Cafe<br>Breakfast Deal</h3>
                            
                            <!-- Countdown Timer -->
                            <div class="text-4xl font-black text-gray-900 mb-4 countdown-timer" data-end-time="2026-01-21T12:00:00">
                                02:35:18
                            </div>
                            
                            <!-- Claim Button -->
                            <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-xl transition-colors uppercase tracking-wide">
                                Claim Deal
                            </button>
                        </div>
                    </div>

                    <!-- Deal Card 2 -->
                    <div class="deal-card bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="bg-yellow-400 p-6 relative">
                            <!-- Discount Badge -->
                            <div class="absolute top-4 left-4 bg-red-500 text-white font-black text-lg px-4 py-2 rounded-lg transform -rotate-12 shadow-lg">
                                50% OFF!
                            </div>
                            
                            <!-- Deal Icon -->
                            <div class="flex justify-center items-center h-32 mt-8">
                                <svg class="w-24 h-24 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-900 mb-3">Grand Hotel<br>Weekend Stay</h3>
                            
                            <!-- Countdown Timer -->
                            <div class="text-4xl font-black text-gray-900 mb-4 countdown-timer" data-end-time="2026-01-22T18:00:00">
                                15:42:33
                            </div>
                            
                            <!-- Claim Button -->
                            <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-xl transition-colors uppercase tracking-wide">
                                Claim Deal
                            </button>
                        </div>
                    </div>

                    <!-- Deal Card 3 -->
                    <div class="deal-card bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="bg-yellow-400 p-6 relative">
                            <!-- Discount Badge -->
                            <div class="absolute top-4 left-4 bg-red-500 text-white font-black text-lg px-4 py-2 rounded-lg transform -rotate-12 shadow-lg">
                                60% OFF!
                            </div>
                            
                            <!-- Deal Icon -->
                            <div class="flex justify-center items-center h-32 mt-8">
                                <svg class="w-24 h-24 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-900 mb-3">Flight to Paris<br>Round Trip</h3>
                            
                            <!-- Countdown Timer -->
                            <div class="text-4xl font-black text-gray-900 mb-4 countdown-timer" data-end-time="2026-01-20T23:59:59">
                                05:15:42
                            </div>
                            
                            <!-- Claim Button -->
                            <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-xl transition-colors uppercase tracking-wide">
                                Claim Deal
                            </button>
                        </div>
                    </div>

                    <!-- Deal Card 4 -->
                    <div class="deal-card bg-white rounded-2xl shadow-lg overflow-hidden">
                        <div class="bg-yellow-400 p-6 relative">
                            <!-- Discount Badge -->
                            <div class="absolute top-4 left-4 bg-red-500 text-white font-black text-lg px-4 py-2 rounded-lg transform -rotate-12 shadow-lg">
                                40% OFF!
                            </div>
                            
                            <!-- Deal Icon -->
                            <div class="flex justify-center items-center h-32 mt-8">
                                <svg class="w-24 h-24 text-gray-900" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-900 mb-3">Grocery Bundle<br>Family Pack</h3>
                            
                            <!-- Countdown Timer -->
                            <div class="text-4xl font-black text-gray-900 mb-4 countdown-timer" data-end-time="2026-01-21T08:00:00">
                                09:22:15
                            </div>
                            
                            <!-- Claim Button -->
                            <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-3 px-6 rounded-xl transition-colors uppercase tracking-wide">
                                Claim Deal
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
